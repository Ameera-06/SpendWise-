<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SpendWise 💰</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <nav class="navbar">
        <div class="nav-brand">SpendWise 💰</div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h1>Reset Password</h1>
            <p class="subtitle">Complete the fields below to update your security credentials</p>
            
            <form id="forgotForm">
                <div class="form-group" id="emailGroup">
                    <label>Enter the mail</label>
                    <input type="email" id="forgotEmail" placeholder="Enter your email" required>
                </div>

                <div id="passwordFields">
                    <div class="form-group">
                        <label>Enter the new password</label>
                        <div class="password-wrapper">
                            <input type="password" id="newPassword" placeholder="Enter the new password">
                            <span class="password-toggle" onclick="togglePassword('newPassword')">👁️‍🗨️</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Re-enter the password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmNewPassword" placeholder="Re-enter the password">
                            <span class="password-toggle" onclick="togglePassword('confirmNewPassword')">👁️‍🗨️</span>
                        </div>
                    </div>
                </div>
                
                <div id="resetError" class="info-msg" style="margin-top: 15px; font-size: 0.9rem; line-height: 1.4;"></div>
                <button type="submit" id="resetBtn" class="btn btn-primary w-full">Confirm password</button>
            </form>

            <div class="auth-switch">
                <p><a href="index.html" class="auth-link">Back to Sign In</a></p>
            </div>
        </div>
    </div>
    <script type="module" src="script.ts"></script>
</body>
</html>

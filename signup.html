<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SpendWise 💰</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <nav class="navbar">
        <div class="nav-brand">SpendWise 💰</div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h1>Join SpendWise 💰</h1>
            <p class="subtitle">Start your journey to financial freedom</p>
            
            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter the password" required>
                        <span class="password-toggle" onclick="togglePassword('password')">👁️‍🗨️</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Re-enter the password" required>
                        <span class="password-toggle" onclick="togglePassword('confirmPassword')">👁️‍🗨️</span>
                    </div>
                </div>
                
                <div id="signupError" class="error-msg"></div>
                
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <div class="auth-switch">
                <p>Already have an account? <a href="index.html" class="auth-link">Sign in instead</a></p>
            </div>
        </div>
    </div>
    <script type="module" src="script.ts"></script>
</body>
</html>
